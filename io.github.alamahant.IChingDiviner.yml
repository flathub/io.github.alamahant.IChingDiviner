app-id: io.github.alamahant.IChingDiviner
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: IChingDiviner
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
# needed for playing coin toss sound effects
  - --socket=pulseaudio
modules:
  - name: IChingDiviner
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/alamahant/IChingDiviner.git
        tag: v1.0.5
        commit: 9a93a4b971126b964faa03eb41e6aedce610c5cc
      
