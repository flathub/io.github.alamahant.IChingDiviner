app-id: io.github.alamahant.IChingDiviner
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: IChingDiviner
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
# needed for playing coin toss sound effects
  - --socket=pulseaudio
modules:
  - name: IChingDiviner
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK_BUILD=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/alamahant/IChingDiviner.git
        tag: v1.0.4
        commit: 7b92889889e27cde4dbf88a071a0f58e01654e06
      
